<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Participantes - SIGE</title>
    <script src="app.js" defer></script>
</head>

<body data-pagina="participantes">
    <header>
        <h1>SIGE - Gerenciador de Eventos</h1>
        <nav>
            <a href="index.html">Painel Geral</a> |
            <a href="eventos.html">Eventos</a> |
            <a href="participantes.html"><strong>Participantes</strong></a> |
            <a href="inscricoes.html">Inscrições</a> |
            <a href="relatorios.html">Relatórios</a>
        </nav>
        <hr>
    </header>

    <main>
        <p id="mensagem-status"></p>

        <section>
            <form id="form-participante">
                <fieldset>
                    <legend id="titulo-form-participante">Cadastrar Participante</legend>
                    <input type="hidden" id="id_participante" name="id_participante" value="">

                    <p>
                        <label for="nome">Nome completo</label><br>
                        <input type="text" id="nome" name="nome" required maxlength="150" size="45">
                    </p>

                    <p>
                        <label for="email">E-mail</label><br>
                        <input type="email" id="email" name="email" required maxlength="150" size="45">
                    </p>

                    <p>
                        <label for="cpf">CPF (somente números ou formatado)</label><br>
                        <input type="text" id="cpf" name="cpf" required maxlength="14" placeholder="000.000.000-00">
                    </p>

                    <p>
                        <label for="telefone">Telefone</label><br>
                        <input type="tel" id="telefone" name="telefone" maxlength="20">
                    </p>

                    <p>
                        <button type="submit" id="btn-salvar-participante">Cadastrar participante</button>
                        <button type="button" id="btn-cancelar-edicao-participante" hidden>Cancelar edição</button>
                    </p>
                </fieldset>
            </form>
        </section>

        <hr>

        <section aria-labelledby="titulo-lista-participantes">
            <h2 id="titulo-lista-participantes">Participantes Cadastrados</h2>

            <form id="form-busca-participante" role="search">
                <p>
                    <label for="busca-participante">Pesquisar participante</label><br>
                    <input type="search" id="busca-participante" name="busca" placeholder="Nome, e-mail ou CPF" size="35">
                    <button type="submit">Pesquisar</button>
                    <button type="button" id="btn-limpar-busca-participante">Limpar</button>
                </p>
            </form>

            <table border="1" cellpadding="6" cellspacing="0">
                <thead>
                    <tr>
                        <th scope="col">ID</th>
                        <th scope="col">Nome</th>
                        <th scope="col">E-mail</th>
                        <th scope="col">CPF</th>
                        <th scope="col">Telefone</th>
                        <th scope="col">Ações</th>
                    </tr>
                </thead>
                <tbody id="tabela-participantes">
                    <tr>
                        <td colspan="6">Carregando participantes...</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>
</body>

</html>
