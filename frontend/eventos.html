<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos - SIGE</title>
    <script src="app.js" defer></script>
</head>

<body data-pagina="eventos">
    <header>
        <h1>SIGE - Gerenciador de Eventos</h1>
        <nav>
            <a href="index.html">Painel Geral</a> |
            <a href="eventos.html"><strong>Eventos</strong></a> |
            <a href="participantes.html">Participantes</a> |
            <a href="inscricoes.html">Inscrições</a> |
            <a href="relatorios.html">Relatórios</a>
        </nav>
        <hr>
    </header>

    <main>
        <p id="mensagem-status"></p>

        <section>
            <form id="form-evento">
                <fieldset>
                    <legend id="titulo-form-evento">Cadastrar Evento</legend>
                    <input type="hidden" id="id_evento" name="id_evento" value="">

                    <p>
                        <label for="nome_evento">Nome do evento</label><br>
                        <input type="text" id="nome_evento" name="nome_evento" required maxlength="150" size="45">
                    </p>

                    <p>
                        <label for="data_evento">Data do evento</label><br>
                        <input type="date" id="data_evento" name="data_evento" required>
                    </p>

                    <fieldset>
                        <legend>Turnos disponíveis</legend>
                        <label><input type="checkbox" name="turnos" value="matutino"> Matutino</label>
                        <label><input type="checkbox" name="turnos" value="vespertino"> Vespertino</label>
                        <label><input type="checkbox" name="turnos" value="noturno"> Noturno</label>
                    </fieldset>

                    <p>
                        <label for="vagas">Quantidade de vagas</label><br>
                        <input type="number" id="vagas" name="vagas" min="1" required>
                    </p>

                    <p>
                        <label for="descricao">Descrição</label><br>
                        <textarea id="descricao" name="descricao" rows="3" cols="45"></textarea>
                    </p>

                    <p>
                        <button type="submit" id="btn-salvar-evento">Cadastrar evento</button>
                        <button type="button" id="btn-cancelar-edicao" hidden>Cancelar edição</button>
                    </p>
                </fieldset>
            </form>
        </section>

        <hr>

        <section aria-labelledby="titulo-lista-eventos">
            <h2 id="titulo-lista-eventos">Eventos Cadastrados</h2>

            <form id="form-busca-evento" role="search">
                <p>
                    <label for="busca-evento">Pesquisar evento</label><br>
                    <input type="search" id="busca-evento" name="busca" placeholder="Nome, descrição ou turno" size="35">
                    <button type="submit">Pesquisar</button>
                    <button type="button" id="btn-limpar-busca-evento">Limpar</button>
                </p>
            </form>

            <table border="1" cellpadding="6" cellspacing="0">
                <thead>
                    <tr>
                        <th scope="col">ID</th>
                        <th scope="col">Nome</th>
                        <th scope="col">Data</th>
                        <th scope="col">Turnos</th>
                        <th scope="col">Vagas</th>
                        <th scope="col">Descrição</th>
                        <th scope="col">Ações</th>
                    </tr>
                </thead>
                <tbody id="tabela-eventos">
                    <tr>
                        <td colspan="7">Carregando eventos...</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>
</body>

</html>
